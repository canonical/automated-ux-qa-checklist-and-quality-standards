name: UX demo review

on:
  pull_request:
    types: [labeled]

jobs:
  demo-review:
    if: github.event.label.name == 'Review: UX needed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install gh CLI
        run: gh --version

      - name: Parse PR inputs
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          echo "Parsing inputs from: $PR_URL"
          OUTPUT=$(./demo-review/scripts/parse-pr-inputs.sh "$PR_URL")
          echo "$OUTPUT"
          echo "inputs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post parsed inputs as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BODY=$(cat <<'COMMENT'
          ## 🔍 UX demo review – inputs detected

          ```json
          ${{ steps.parse.outputs.inputs }}
          ```

          _This is a dry-run confirmation that the trigger and parser are working. The full review skill will replace this comment._
          COMMENT
          )
          gh pr comment "$PR_NUMBER" --body "$BODY"
