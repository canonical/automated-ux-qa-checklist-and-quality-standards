name: UX demo review

# Reusable workflow that runs ONLY the demo review (not copy doc, not Figma) for
# a pull request and posts the report back to that PR as a comment.
#
# The review is executed directly in the runner via the GitHub Copilot CLI
# (driven by run_review.py --demo-only --comment), so the result is
# deterministic and does not depend on the caller repo's Copilot coding agent.
#
# Calling repos add a thin caller workflow (see README.md) that references this
# file with `uses:` and passes the PR number plus the COPILOT_CLI_TOKEN secret.

on:
  # Called from another repository's workflow.
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      ref:
        description: >-
          Git ref (branch, tag, or SHA) of this skills repo to run from.
          Pin this to a tag/SHA for reproducible reviews. Defaults to main.
        required: false
        type: string
        default: main
    secrets:
      COPILOT_CLI_TOKEN:
        description: >-
          Fine-grained PAT with the "Copilot Requests" permission, used to
          authenticate the Copilot CLI that runs the review.
        required: true

  # Manual trigger for this repo (e.g. testing against a PR in another repo).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      ref:
        description: "Ref of this skills repo to run from"
        required: false
        type: string
        default: main

  # Direct trigger when a PR in *this* repo is labelled.
  pull_request_target:
    types: [labeled]

# The token used by gh to read the PR and post the comment. For workflow_call
# this is the caller repo's GITHUB_TOKEN, which needs write access to comment.
permissions:
  pull-requests: write
  contents: read

jobs:
  demo-review:
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'Review: UX needed')
    runs-on: ubuntu-latest

    steps:
      # Check out THIS skills repo (not the caller's). The skill files,
      # checklists, and scripts that drive the review all live here.
      - name: Check out skills repo
        uses: actions/checkout@v4
        with:
          repository: canonical/automated-ux-qa-checklist-and-quality-standards
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GitHub Copilot CLI
        run: |
          curl -fsSL https://gh.io/copilot-install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify tooling
        run: |
          copilot --version
          gh --version
          python3 --version

      - name: Run demo review and post report to the PR
        env:
          # Copilot CLI auth (highest-precedence env var for the CLI). Uses the
          # caller-supplied PAT with the "Copilot Requests" permission.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          # gh auth: reads the PR body and posts the report comment. Uses the
          # workflow's own GITHUB_TOKEN (needs pull-requests: write).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          echo "Running demo review for: $PR_URL"
          python3 run_review.py "$PR_URL" --demo-only --comment
